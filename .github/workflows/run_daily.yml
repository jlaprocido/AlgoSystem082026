name: Run Daily Trading Script

# 9:45am America/Chicago. schedule: is UTC-only and doesn't follow DST, so this is only exactly
# right for CDT (UTC-5) -- flip to "45 15 * * 1-5" during CST (roughly Nov-Mar). We're moving
# this to a VM soon where a real local-time cron handles DST on its own, so not worth building
# out DST-proofing here in the meantime.
on:
  schedule:
    - cron: "45 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "run-daily-pages"
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run daily trading script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.trading.run_daily

      # runners are ephemeral -- a fresh checkout every run -- so the trade log and any risk
      # state written this run have to be committed back or they'd silently reset next time.
      # Three separate workflows (plus a possible local push from you) can all try to push to
      # main around the same time -- a plain `git push` here failed exactly that way once
      # already (non-fast-forward rejection). Retries with fetch+rebase in between; a real
      # conflict (two runs writing the same risk-state file within seconds of each other) or
      # running out of retries drops this run's state commit rather than failing the job --
      # the actual trade/notification already happened before this step, so losing the local
      # persistence of it once is a much smaller problem than a false-red job status.
      - name: Persist trade log / risk state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.union.driver "git merge-file --union %A %O %B"
          git add data/orders/trade_log.csv data/risk/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update trade log / risk state [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- another run or a local push landed first. Fetching and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict -- dropping this run's state commit instead of failing the job."
              git rebase --abort
              exit 0
            fi
            sleep $((RANDOM % 10 + 1))
          done
          echo "Failed to push after 5 attempts -- giving up without failing the job."

      - name: Build dashboard
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m src.dashboard.build_dashboard

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

      - uses: actions/deploy-pages@v5.0.1
        id: deployment
