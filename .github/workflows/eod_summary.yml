name: EOD Summary

# See run_daily.yml for why both UTC equivalents of the target ET time are scheduled -- this
# one specifically CAN duplicate-fire on the same calendar day (once from each cron line, or
# from a manual workflow_dispatch on top of the scheduled run), which is exactly what
# eod_summary.py's own same-day dedup guard exists to make a silent no-op instead of a second
# notification.
on:
  schedule:
    - cron: "5 20 * * 1-5"  # 4:05pm EDT (UTC-4)
    - cron: "5 21 * * 1-5"  # 4:05pm EST (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  eod-summary:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run EOD summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.trading.eod_summary

      - name: Persist risk state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/risk/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update risk state [skip ci]"
            git push
          fi

      - name: Build dashboard
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m src.dashboard.build_dashboard

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

      - uses: actions/deploy-pages@v5.0.1
        id: deployment
