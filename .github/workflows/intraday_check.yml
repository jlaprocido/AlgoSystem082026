name: Intraday Risk Check

# Runs roughly hourly, 14:15-20:15 UTC, Mon-Fri -- covers 10:15am-4:15pm EDT and 9:15am-3:15pm
# EST without needing DST-aware scheduling (see run_daily.yml for the general reasoning); the
# extra checks that land before/after actual market hours in either DST state just hit
# intraday_check.py's own market-closed early exit, a harmless no-op. Minute :15 (not :00) is
# deliberate -- GitHub documents the top of the hour as the most congested/delayed time for
# scheduled workflows.
#
# This is the fast circuit breaker for a leveraged position: it never opens a new position or
# changes the strategy's target, it only checks the existing drawdown/daily-loss limits and
# flattens if breached -- see aapl_sma.LEVERAGE_MULTIPLIER and README's "Leverage" section for
# why run_daily.py's once-a-day cadence alone isn't fast enough once leverage is in play.
on:
  schedule:
    - cron: "15 14-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  intraday-check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run intraday risk check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.trading.intraday_check

      # concurrency: group "pages" above serializes this against the other two workflows, but
      # not against a local `git push` from you -- retries with fetch+rebase in between for
      # that case; a real conflict or running out of retries drops this run's state commit
      # rather than failing the job (the trade/notification already happened before this step)
      - name: Persist trade log / risk state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.union.driver "git merge-file --union %A %O %B"
          git add data/orders/trade_log.csv data/risk/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update trade log / risk state [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- another run or a local push landed first. Fetching and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict -- dropping this run's state commit instead of failing the job."
              git rebase --abort
              exit 0
            fi
            sleep $((RANDOM % 10 + 1))
          done
          echo "Failed to push after 5 attempts -- giving up without failing the job."

      - name: Build dashboard
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m src.dashboard.build_dashboard

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

      - uses: actions/deploy-pages@v5.0.1
        id: deployment
